name: CI
# Unit tests (hand-built beneficiaries), an end-to-end test on a small simulated fixture, and a render of the documents from the committed
# aggregate outputs. No CMS data are needed or downloaded. The SAS reconciliation (sas/cohort_qc.sas) is NOT run here: run it manually in SAS OnDemand.
on: [push, pull_request]
jobs:
  tests-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv                      # the R version recorded in renv.lock
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2      # restores the exact package versions in renv.lock (cached)
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Unit tests and end-to-end fixture test
        run: Rscript tests/testthat.R
      - name: Render documents from the committed aggregate outputs
        run: |
          quarto render docs/feasibility.qmd
          quarto render docs/sap.qmd
          quarto render docs/study_report.qmd
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-documents
          path: docs/*.html
      - name: SAS reconciliation (manual)
        run: echo "sas/cohort_qc.sas is run manually in SAS OnDemand (see README); it is not part of CI."
